name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FleetDesk.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FleetDesk-apk
          path: FleetDesk.apk
          retention-days: 30

      - name: Publish APK to apk branch
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk
          git rm -rf --cached . >/dev/null
          git add -f FleetDesk.apk
          git commit -m "FleetDesk.apk"
          git push -f origin apk
